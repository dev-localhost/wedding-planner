<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>결혼 준비 체크리스트</title>
  
  <!-- Manifest & iOS 설정 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="결혼 준비">
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/googlefonts/noto-emoji/main/png/128/emoji_u1f48d.png">
  <link rel="icon" href="https://raw.githubusercontent.com/googlefonts/noto-emoji/main/png/128/emoji_u1f48d.png" type="image/png">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background-color: #ffffff; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>
  <!-- Apps Script /exec 정식 URL 주소 -->
  <iframe src="https://script.google.com/macros/s/AKfycbxwXGanyH0VsyCvUzlx5qAgKMYWFEmr3uxD2AkMKWYMuP4gk0wxu1Gswhk-7d_QFT9kZg/exec"></iframe>

  <script>
    // 서비스 워커 등록 (PWA 설치 필수 요건)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW 등록 완료:', reg.scope))
          .catch(err => console.error('SW 등록 실패:', err));
      });
    }
  </script>
</body>
</html>
